<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - 9 Giờ Kém 15</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: radial-gradient(circle at center, #111827 0%, #080c14 100%); color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { background: rgba(15,23,42,0.9); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 40px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 25px 50px rgba(0,0,0,0.5); }
        .login-card h1 { font-size: 24px; font-weight: 800; margin-bottom: 8px; color: #f59e0b; }
        .login-card p { color: #94a3b8; font-size: 14px; margin-bottom: 32px; }
        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: #94a3b8; margin-bottom: 8px; }
        .form-group input { width: 100%; padding: 14px 16px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2); border-radius: 10px; color: #fff; font-size: 14px; }
        .form-group input:focus { outline: none; border-color: #f59e0b; }
        .btn-login { width: 100%; background: linear-gradient(135deg,#f59e0b,#d97706); color: #fff; border: none; padding: 14px; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; transition: all 0.2s; }
        .btn-login:hover { box-shadow: 0 6px 20px rgba(245,158,11,0.4); }
        .error { background: rgba(239,68,68,0.2); border: 1px solid rgba(239,68,68,0.3); color: #ef4444; padding: 12px; border-radius: 8px; font-size: 13px; margin-bottom: 20px; }
        .back-link { display: inline-block; margin-top: 24px; color: #94a3b8; text-decoration: none; font-size: 13px; }
        .back-link:hover { color: #fff; }
        .version-badge {
            position: fixed;
            bottom: 16px;
            right: 16px;
            z-index: 1000;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 6px 12px;
            font-size: 13px;
            font-weight: 600;
            color: #fff;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            min-width: 40px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>🎫 Admin Dashboard</h1>
        <p>9 Giờ Kém 15 - Quản lý đơn hàng</p>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        <form method="POST" action="/admin/login">
            <div class="form-group">
                <label>Mật khẩu Admin</label>
                <input type="password" name="password" placeholder="Nhập mật khẩu" required autofocus>
            </div>
            <button type="submit" class="btn-login">Đăng nhập</button>
        </form>
        <a href="/" class="back-link">← Quay về trang mua vé</a>
    </div>
    <div class="version-badge">v{{ version }}</div>
</body>
</html>
